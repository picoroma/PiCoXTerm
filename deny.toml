# cargo-deny (SEC-12): licenze, advisory di sicurezza, sorgenti delle dipendenze.
# Si esegue con: cargo deny check

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
version = 2
# Advisory ignorati. Ogni voce è motivata ed è registrata nelle specifiche (sezione 12): da rivedere
# a ogni aggiornamento delle dipendenze.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Marvin attack sul crate rsa (usato da russh per le chiavi RSA). Nessuna versione corretta esiste. Rischio accettato (D-18): servono osservazioni di timing dell'operazione con chiave privata RSA; mitigazione: preferire chiavi ed25519/ECDSA" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error non mantenuto: dipendenza di compilazione della catena GTK/Tauri su Linux, non presente nell'eseguibile" },
]

[licenses]
version = 2
# Solo licenze permissive (principio "auditabile per costruzione").
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
