# cargo-deny (SEC-12): licenze, advisory di sicurezza, sorgenti delle dipendenze.
# Si esegue con: cargo deny check

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
version = 2
# Advisory ignorati. Ogni voce è motivata ed è registrata nelle specifiche (sezione 12): da rivedere
# a ogni aggiornamento delle dipendenze.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Marvin attack sul crate rsa (usato da russh per le chiavi RSA). Nessuna versione corretta esiste. Rischio accettato (D-18): servono osservazioni di timing dell'operazione con chiave privata RSA; mitigazione: preferire chiavi ed25519/ECDSA" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant non più mantenuto (annuncio z-galaxy/zbus#2043). Solo su Linux: client del Secret Service (keyring) per le password; non è una vulnerabilità. Rischio accettato (D-27): da rivedere quando keyring passa a una versione che lo sostituisce" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names non più mantenuto (annuncio z-galaxy/zbus#2043). Solo su Linux: client del Secret Service (keyring) per le password; non è una vulnerabilità. Rischio accettato (D-27): da rivedere quando keyring passa a una versione che lo sostituisce" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive non più mantenuto (annuncio z-galaxy/zbus#2043). Solo su Linux: client del Secret Service (keyring) per le password; non è una vulnerabilità. Rischio accettato (D-27): da rivedere quando keyring passa a una versione che lo sostituisce" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error non mantenuto: dipendenza di compilazione della catena GTK/Tauri su Linux, non presente nell'eseguibile" },
]

[licenses]
version = 2
# Solo licenze permissive (principio "auditabile per costruzione").
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "BSL-1.0",
    # Licenza permissiva per dati (elenco dei certificati radice Mozilla in `webpki-roots`); solo nel motore RDP.
    "CDLA-Permissive-2.0",
]
# I crate del progetto sono GPL-3.0-only (D-30): solo loro, le dipendenze restano permissive.
exceptions = [
    { allow = ["GPL-3.0-only"], crate = "picoxterm" },
    { allow = ["GPL-3.0-only"], crate = "pxt-core" },
    { allow = ["GPL-3.0-only"], crate = "pxt-ssh" },
    { allow = ["GPL-3.0-only"], crate = "pxt-fs" },
    { allow = ["GPL-3.0-only"], crate = "pxt-rdp" },
    { allow = ["GPL-3.0-only"], crate = "pxt-rdp-proto" },
    { allow = ["GPL-3.0-only"], crate = "picoxterm-rdp" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
