[package]
name = "pxt-fs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
russh-sftp = "3.0.1"
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "sync", "macros", "fs", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
suppaftp = { version = "12.2.1", default-features = false, features = ["deprecated", "tokio", "tokio-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8.5"
sha2 = "0.11.1"
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest", "sso"] }
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest", "http-1x"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring", "rt-tokio"] }

[dev-dependencies]
pxt-ssh = { path = "../pxt-ssh" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
