name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Senza informazioni di debug i binari di prova pesano molto meno (il disco del runner Linux è stretto).
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Libera spazio su disco (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Dipendenze di sistema di Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Il frontend deve esistere perché Tauri lo incorpora in fase di compilazione.
      - name: Frontend (installazione, controllo tipi, build)
        working-directory: ui
        run: |
          npm ci
          npm run check
          npm run build

      - name: Formattazione
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Le prove end-to-end contro il server di testenv/ sono marcate #[ignore] e non girano qui.
      - name: Test
        run: cargo test --workspace


  # Il motore RDP (D-33) è un programma a parte con il suo Cargo.lock: ha un job suo, perché con
  # l'app nello stesso job il disco del runner Linux si esauriva.
  rdp-engine:
    name: Motore RDP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rdp-engine
      - name: Formattazione, clippy e test
        working-directory: rdp-engine
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  security:
    name: Sicurezza delle dipendenze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo deny (licenze, advisory, sorgenti)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: cargo deny sul motore RDP
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: rdp-engine/Cargo.toml
