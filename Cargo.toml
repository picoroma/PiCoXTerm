[workspace]
resolver = "2"
members = ["crates/pxt-core", "crates/pxt-ssh", "crates/pxt-fs", "crates/pxt-rdp", "src-tauri"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "GPL-3.0-only"
authors = ["PiCo"]

[workspace.dependencies]
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
