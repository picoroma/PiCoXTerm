ModulePath /usr/lib/proftpd
LoadModule mod_tls.c
ServerName "PiCoXterm FTPS implicito (prova)"
ServerType standalone
DefaultServer on
Port 990
UseIPv6 off
Umask 022
MaxInstances 30
User nobody
Group nobody
DefaultRoot ~
RequireValidShell off
AuthOrder mod_auth_unix.c
WtmpLog off
ScoreboardFile /run/proftpd/proftpd.scoreboard
ControlsEngine off
DelayEngine off
UseReverseDNS off
# Modo passivo: porte fisse, pubblicate solo su loopback
PassivePorts 30010 30019
MasqueradeAddress 127.0.0.1

<IfModule mod_tls.c>
  TLSEngine on
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRSACertificateFile /etc/ssl/private/proftpd.pem
  TLSRSACertificateKeyFile /etc/ssl/private/proftpd.pem
  # TLS implicito: si parla TLS fin dal primo byte. I client non riusano la sessione TLS nei dati.
  TLSOptions UseImplicitSSL NoSessionReuseRequired
  TLSRequired on
  TLSVerifyClient off
</IfModule>
