# Ambiente di test SOLO per sviluppo: credenziali fittizie, porta esposta solo su loopback.
services:
  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: pxt-test-ssh
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=test
      - USER_PASSWORD=test
      - SUDO_ACCESS=false
      - PUBLIC_KEY_DIR=/pubkeys
    volumes:
      - ./keys/authorized.pub:/pubkeys/authorized.pub:ro
      - ./init:/custom-cont-init.d:ro
    ports:
      - "127.0.0.1:2222:2222"

  # Secondo server, costruito da noi, con utenti che usano shell diverse (bashuser, zshuser, tcshuser, ashuser).
  # Serve ai test del tracciamento della directory: l'immagine sopra fa girare sshd senza privilegi
  # e non permette di cambiare utente.
  ssh-shells:
    build: ./shells
    container_name: pxt-test-shells
    ports:
      - "127.0.0.1:2223:2222"
