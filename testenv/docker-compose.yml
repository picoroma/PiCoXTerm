# Ambiente di test SOLO per sviluppo: credenziali fittizie, porta esposta solo su loopback.
services:
  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: pxt-test-ssh
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=test
      - USER_PASSWORD=test
      - SUDO_ACCESS=false
      - PUBLIC_KEY_DIR=/pubkeys
    volumes:
      - ./keys/authorized.pub:/pubkeys/authorized.pub:ro
      - ./init:/custom-cont-init.d:ro
    ports:
      - "127.0.0.1:2222:2222"

  # Secondo server, costruito da noi, con utenti che usano shell diverse (bashuser, zshuser, tcshuser, ashuser).
  # Serve ai test del tracciamento della directory: l'immagine sopra fa girare sshd senza privilegi
  # e non permette di cambiare utente.
  ssh-shells:
    build: ./shells
    container_name: pxt-test-shells
    ports:
      - "127.0.0.1:2223:2222"

  # Server FTP con TLS esplicito opzionale (certificato autofirmato generato all'avvio): prove di FTP e FTPS.
  # Modo passivo sulle porte 30000-30009, tutte solo su loopback.
  ftp:
    image: stilliard/pure-ftpd:latest
    container_name: pxt-test-ftp
    environment:
      - PUBLICHOST=127.0.0.1
      - FTP_USER_NAME=test
      - FTP_USER_PASS=test
      - FTP_USER_HOME=/home/test
      - FTP_PASSIVE_PORTS=30000:30009
      - ADDED_FLAGS=--tls=1
      - TLS_CN=localhost
      - TLS_ORG=PiCoXterm test
      - TLS_C=IT
    ports:
      - "127.0.0.1:2121:21"
      - "127.0.0.1:30000-30009:30000-30009"

  # Server FTPS IMPLICITO (TLS subito) su 127.0.0.1:2990, certificato autofirmato, utente test/test.
  # ProFTPD, passivo sulle porte 30010-30019. Contiene file di esempio (LEGGIMI.txt, Documenti, Immagini).
  ftps:
    build: ./ftps
    container_name: pxt-test-ftps
    ports:
      - "127.0.0.1:2990:990"
      - "127.0.0.1:30010-30019:30010-30019"
