# Ambiente di test SOLO per sviluppo: credenziali fittizie, porta esposta solo su loopback.
services:
  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: pxt-test-ssh
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=test
      - USER_PASSWORD=test
      - SUDO_ACCESS=false
      - PUBLIC_KEY_DIR=/pubkeys
    volumes:
      - ./keys/authorized.pub:/pubkeys/authorized.pub:ro
      - ./init:/custom-cont-init.d:ro
    ports:
      - "127.0.0.1:2222:2222"

  # Secondo server, costruito da noi, con utenti che usano shell diverse (bashuser, zshuser, tcshuser, ashuser).
  # Serve ai test del tracciamento della directory: l'immagine sopra fa girare sshd senza privilegi
  # e non permette di cambiare utente.
  ssh-shells:
    build: ./shells
    container_name: pxt-test-shells
    ports:
      - "127.0.0.1:2223:2222"

  # Server FTP con TLS esplicito opzionale (certificato autofirmato generato all'avvio): prove di FTP e FTPS.
  # Modo passivo sulle porte 30000-30009, tutte solo su loopback.
  ftp:
    image: stilliard/pure-ftpd:latest
    container_name: pxt-test-ftp
    environment:
      - PUBLICHOST=127.0.0.1
      - FTP_USER_NAME=test
      - FTP_USER_PASS=test
      - FTP_USER_HOME=/home/test
      - FTP_PASSIVE_PORTS=30000:30009
      - ADDED_FLAGS=--tls=1
      - TLS_CN=localhost
      - TLS_ORG=PiCoXterm test
      - TLS_C=IT
    ports:
      - "127.0.0.1:2121:21"
      - "127.0.0.1:30000-30009:30000-30009"

  # Server FTPS IMPLICITO (TLS subito) su 127.0.0.1:2990, certificato autofirmato, utente test/test.
  # ProFTPD, passivo sulle porte 30010-30019. Contiene file di esempio (LEGGIMI.txt, Documenti, Immagini).
  ftps:
    build: ./ftps
    container_name: pxt-test-ftps
    ports:
      - "127.0.0.1:2990:990"
      - "127.0.0.1:30010-30019:30010-30019"

  # Server S3 compatibile per le prove di S3 (RustFS: le immagini pubbliche di MinIO non esistono più).
  # API su 127.0.0.1:9000, credenziali fittizie, solo su loopback. Stesso protocollo di AWS S3:
  # per l'app è un "endpoint personalizzato".
  s3:
    image: rustfs/rustfs:latest
    container_name: pxt-test-s3
    environment:
      - RUSTFS_ACCESS_KEY=pxtaccess
      - RUSTFS_SECRET_KEY=pxtsecret-1234
    ports:
      - "127.0.0.1:9000:9000"

  # Server RDP (xrdp + Xfce) su 127.0.0.1:3390, utente fittizio, solo su loopback. Serve per provare
  # il client RDP integrato (spike M7). Mostra la schermata di login di xrdp dopo la NLA.
  rdp:
    image: scottyhardy/docker-remote-desktop:latest
    container_name: pxt-test-rdp
    hostname: pxtrdp
    shm_size: "1gb"
    environment:
      - USERNAME=pxtuser
      - PASSWORD=pxtpass-1234
    ports:
      - "127.0.0.1:3390:3389"
