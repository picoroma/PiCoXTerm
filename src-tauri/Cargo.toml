[package]
name = "picoxterm"
version.workspace = true
description = "PiCoXterm: client di accesso remoto essenziale"
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "picoxterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
pxt-core = { path = "../crates/pxt-core" }
pxt-ssh = { path = "../crates/pxt-ssh" }
tokio = { workspace = true, features = ["sync"] }
tauri-plugin-clipboard-manager = "2.5.0"
uuid = { version = "1.28.0", features = ["serde"] }
tauri-plugin-dialog = "2.8.3"
pxt-fs = { path = "../crates/pxt-fs" }
pxt-rdp = { path = "../crates/pxt-rdp" }
opener = "0.9.0"

[features]
# Incorpora il frontend nell'exe (la CLI di Tauri lo attiva da sola; con cargo build va esplicito)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
