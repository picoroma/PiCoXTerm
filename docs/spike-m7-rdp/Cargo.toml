[package]
name = "rdpspike"
version = "0.0.0"
edition = "2021"

[dependencies]
ironrdp = { version = "0.17", features = ["connector", "session", "graphics", "input", "cliprdr", "displaycontrol", "dvc"] }
ironrdp-tokio = { version = "0.10", features = ["reqwest-rustls-ring"] }
ironrdp-pdu = "0.9"
ironrdp-graphics = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x509-cert = "0.2"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"


[workspace]
